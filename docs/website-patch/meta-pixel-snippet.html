<!--
  Meta Pixel — paste immediately before </head> in BOTH website/index.html
  and website/he/index.html.

  Replace YOUR_PIXEL_ID with the pixel ID from Meta Events Manager.

  The Lead event is NOT fired here. It fires on successful form submit
  (see site.js.patch.md) with an event_id that the server-side Conversions
  API call reuses — that is how Meta deduplicates the two, so one lead is
  counted once, not twice.
-->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', 'YOUR_PIXEL_ID');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none" alt=""
src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=PageView&noscript=1"/></noscript>
