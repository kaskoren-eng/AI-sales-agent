name: Guardrails

# Mechanical enforcement of CLAUDE.md's multi-session rules. CI (ci.yml) proves the code works;
# this proves the sessions stayed in their lanes and kept the shared claims tables honest.
on:
  pull_request:
    branches: [main]

jobs:
  territory:
    name: Territory (lane) check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ADVISORY for now: it annotates the PR but does not block. Flip to false once every open
    # branch has seen it at least once, then add it to branch protection's required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch origin main
      - run: scripts/ci/territory-check.sh "${{ github.head_ref }}" origin/main

  migration-claims:
    name: Migration claims table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/migration-claims-check.sh

  schema-drift:
    name: Schema drift (migrations vs schema)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ADVISORY ON ITS FIRST PASS, exactly like the territory check above and for the same reason:
    # nobody has ever run this in CI, and if `main` already carries drift a blocking job would
    # stop every open PR at once. Flip `continue-on-error` to false the first time it is seen
    # green on main, then add it to branch protection's required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # drizzle-kit is invoked by the script to build the schema-side reference; Docker is already
      # on ubuntu-latest, which is the whole point of moving this off a developer's laptop.
      - run: npm ci

      - name: Replay every migration into a throwaway Postgres and diff it against the schema
        run: npm run db:drift
